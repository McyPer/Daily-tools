<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KINETIC // Daily Tools Workbench — PDF, Image, Unit, Percentage & Loan Tools</title>
  <meta name="description" content="Production-ready client-side daily tools workbench: Convert PDF to images, compress images, convert units, calculate percentages, and generate loan amortization schedules." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- Modular Separate CSS Files -->
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <!-- PDF.js Client-Side Renderer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- Top Utility Bar -->
    <header class="top-utility-bar">
      <div class="top-utility-inner">
        <a href="#all" class="brand-cluster" id="brand-home-link">
          <div class="brand-mark-box">
            K//5
            <span class="brand-mark-dot"></span>
          </div>
          <div>
            <div class="brand-title">KINETIC WORKBENCH</div>
            <div class="brand-subtitle">SWISS DAILY INSTRUMENTS</div>
          </div>
        </a>

        <div class="header-actions" style="display:flex;align-items:center;gap:12px;">
          <div class="input-well" style="height:36px;width:240px;">
            <input type="search" id="tool-search-input" placeholder="Filter tools (⌘K)..." aria-label="Search tools" />
          </div>
          <button type="button" id="theme-toggle-btn" class="btn-kinetic btn-sm" aria-label="Toggle Dark Mode">
            <span id="theme-toggle-label">DARK MODE</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 2-Column Workspace -->
    <div class="workspace-container">
      <aside class="nav-rail" aria-label="Tools Navigation">
        <div>
          <div class="nav-section-label">DIRECTORY</div>
          <button class="nav-item-btn active" data-tool="pdf-to-img">
            <span>1. PDF to Images</span>
            <span class="nav-item-code">PDF</span>
          </button>
          <button class="nav-item-btn" data-tool="img-compress">
            <span>2. Compress Images</span>
            <span class="nav-item-code">IMG</span>
          </button>
          <button class="nav-item-btn" data-tool="unit-converter">
            <span>3. Unit Converter</span>
            <span class="nav-item-code">UNT</span>
          </button>
          <button class="nav-item-btn" data-tool="percentage-calc">
            <span>4. Percentage Calc</span>
            <span class="nav-item-code">PCT</span>
          </button>
          <button class="nav-item-btn" data-tool="loan-calc">
            <span>5. Loan Calculator</span>
            <span class="nav-item-code">FIN</span>
          </button>
        </div>
        <div class="tech-badge" style="justify-content:center;padding:8px;">
          100% CLIENT-SIDE ENGINE
        </div>
      </aside>

      <!-- Active Tool Canvas -->
      <main class="workbench-main" id="workbench-root"></main>
    </div>
  </div>

  <!-- Modular ES6 JavaScript Entry Point -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
