  gap: 16px;
}

.brand-cluster {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  color: inherit;
}

.brand-mark-box {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-md);
  background-color: var(--text-primary);
  color: var(--bg-primary);

  justify-content: space-between;

  font-size: 0.875rem;

  border-color: var(--border-hairline);

  border: 1px solid var(--border-hairline);
}

.nav-item-btn.active .nav-item-code {
  background-color: var(--accent-primary-soft);
  color: var(--accent-primary);

  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 28px;

  justify-content: space-between;
  gap: 16px;
  padding-bottom: 22px;

  flex-direction: column;
  gap: 6px;
}

  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--accent-primary);
}

.workbench-h1 {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 2.5vw, 2rem);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.2;
  color: var(--text-primary);
  margin: 0;
}

.workbench-desc {
  font-size: 0.9375rem;
  color: var(--text-secondary);
  max-width: 65ch;
  margin: 0;
}

/* Bento Grid Layouts */
.bento-grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 20px;
}

.bento-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
}

.workbench-split-asymmetric {
  display: grid;
  grid-template-columns: 380px minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}

  display: none;

}

    grid-template-columns: 1fr;

  .mobile-tool-strip {
    display: flex;
  }
  .workbench-main {
    padding: 20px 16px 40px;
  }
  .top-utility-inner {
    padding: 0 16px;
  }
}

    activeFile = e.target.files?.[0];

}

  function populateUnits() {
    const map = UNITS[catSel.value];
    const keys = Object.keys(map);
    selA.innerHTML = keys.map((k) => \`<option value="\${k}">\${k}</option>\`).join('');

  valA.addEventListener('input', calcForward);
